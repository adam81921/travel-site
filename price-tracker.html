<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>價格追蹤</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💹</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #2a2420; --ink-light: #6f655c; --ink-muted: #9c9289;
    --paper: #fcf8f1; --paper-warm: #f4ece0; --paper-card: #ffffff;
    --accent: #c4392d; --gold: #a3720a;
    --border: rgba(42,36,32,0.13); --border-soft: rgba(42,36,32,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--paper); color: var(--ink);
    font-weight: 300; font-size: 17px; line-height: 1.8;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 {
    font-family: 'M PLUS Rounded 1c','Noto Sans TC',sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 300; margin-bottom: 0.3rem;
  }
  .sub { color: var(--ink-light); font-size: 14px; margin-bottom: 2.5rem; }
  .sub a { color: var(--accent); }

  .card {
    background: var(--paper-card); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 1.5rem 1.4rem 1.2rem; margin-bottom: 1.5rem;
    box-shadow: 0 4px 18px rgba(42,36,32,0.05);
  }
  .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; margin-bottom:0.3rem; }
  .card-title { font-size: 1.15rem; font-weight: 500; line-height:1.4; }
  .card-note { font-size: 13px; color: var(--ink-light); }
  .stat { text-align: right; }
  .stat-num {
    font-family:'M PLUS Rounded 1c',sans-serif; font-size: 1.7rem; font-weight: 500;
    line-height: 1.15; color: var(--ink); white-space: nowrap;
  }
  .stat-cap { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.05em; }
  .stat .below { color: #1c7a43; }
  .chart-wrap { position: relative; height: 240px; margin-top: 0.8rem; }
  .latest {
    margin-top: 0.9rem; border-top: 0.5px solid var(--border-soft); padding-top: 0.6rem;
    font-size: 13.5px; color: var(--ink-light);
  }
  .latest .row { display: flex; justify-content: space-between; gap: 1rem; padding: 2px 0; }
  .latest .row b { color: var(--ink); font-weight: 500; font-family:'M PLUS Rounded 1c',sans-serif; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:baseline; }
  .empty {
    text-align:center; color: var(--ink-muted); padding: 3rem 1rem;
    border: 1px dashed var(--border); border-radius: 12px; font-size: 15px;
  }
  footer { text-align:center; color: var(--ink-muted); font-size: 12px; margin-top: 2.5rem; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💹 價格追蹤</h1>
  <div class="sub">每天 21:10 自動查價 · 資料與設定在 <a href="https://github.com/adam81921/price-tracker" target="_blank" rel="noopener">price-tracker repo</a>（改 watchlist.json 即可增減追蹤）</div>
  <div id="cards"></div>
  <footer>flight = SerpAPI Google Flights · hotel = Google Hotels（各 OTA）＋樂天 Travel（房型/方案）</footer>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/adam81921/price-tracker/main/';
// 通過 CVD/對比驗證的類別色（淺色紙面）
const COLORS = ['#c4392d', '#1d7fa8', '#a3720a'];

const fmt = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });

function parseCSV(text) {
  // tracker 寫入時已把 label 內的半形逗號換成全形，欄位不會再含分隔符
  const lines = text.trim().split('\n');
  const head = lines.shift().split(',');
  return lines.map((l) => {
    const parts = l.split(',');
    const o = {};
    head.forEach((h, i) => { o[h] = parts[i]; });
    return o;
  });
}

async function main() {
  const cardsEl = document.getElementById('cards');
  let watchlist = { watches: [] }, rows = [];
  try {
    watchlist = await fetch(RAW + 'watchlist.json', { cache: 'no-store' }).then((r) => r.json());
  } catch (e) { /* watchlist 讀不到就只畫數據 */ }
  try {
    const txt = await fetch(RAW + 'data/prices.csv', { cache: 'no-store' }).then((r) => r.ok ? r.text() : '');
    if (txt) rows = parseCSV(txt);
  } catch (e) { /* 還沒有資料 */ }

  const byId = {};
  rows.forEach((r) => {
    if (!r.price) return;
    (byId[r.id] = byId[r.id] || []).push(r);
  });

  const watches = (watchlist.watches || []).filter((w) => w.enabled || byId[w.id]);
  if (!watches.length && !Object.keys(byId).length) {
    cardsEl.innerHTML = '<div class="empty">還沒有資料 — tracker 設好 API 金鑰後，第一次查價就會出現在這裡。</div>';
    return;
  }

  const ids = [...new Set([...watches.map((w) => w.id), ...Object.keys(byId)])];
  ids.forEach((id) => {
    const w = watches.find((x) => x.id === id) || {};
    const data = byId[id] || [];
    const cur = w.currency || (data[0] && data[0].currency) || '';

    // 每日每來源最低價
    const bySource = {};
    data.forEach((r) => {
      const src = r.source.split(':')[0]; // google:Agoda → google
      const p = parseFloat(r.price);
      const day = ((bySource[src] = bySource[src] || {})[r.date] =
        Math.min(bySource[src][r.date] ?? Infinity, p));
    });
    const sources = Object.keys(bySource).slice(0, 3);
    const allDates = [...new Set(data.map((r) => r.date))].sort();

    // 最新最低價 + 當日明細
    const lastDate = allDates[allDates.length - 1];
    const todayRows = data.filter((r) => r.date === lastDate)
      .sort((a, b) => parseFloat(a.price) - parseFloat(b.price)).slice(0, 4);
    const best = todayRows.length ? parseFloat(todayRows[0].price) : null;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="card-title">${w.note || id}</div>
          <div class="card-note">${id}${w.check_in ? ' · ' + w.check_in + (w.room_keyword ? ' · 房型:' + w.room_keyword : '') : ''}${w.threshold ? ' · 門檻 ' + fmt(w.threshold) : ''}</div>
        </div>
        <div class="stat">
          <div class="stat-num ${w.threshold && best !== null && best <= w.threshold ? 'below' : ''}">${best !== null ? fmt(best) + ' ' + cur : '—'}</div>
          <div class="stat-cap">${lastDate ? lastDate + ' 最低' : '尚無資料'}</div>
        </div>
      </div>
      ${allDates.length ? '<div class="chart-wrap"><canvas></canvas></div>' : ''}
      ${todayRows.length ? `<div class="latest">${todayRows.map((r) =>
        `<div class="row"><span>${r.source} · ${r.label}</span><b>${fmt(r.price)}</b></div>`).join('')}</div>` : ''}
    `;
    cardsEl.appendChild(card);

    if (!allDates.length) return;
    const datasets = sources.map((src, i) => ({
      label: src,
      data: allDates.map((d) => bySource[src][d] ?? null),
      borderColor: COLORS[i], backgroundColor: COLORS[i],
      borderWidth: 2, pointRadius: allDates.length > 30 ? 0 : 3, pointHoverRadius: 5,
      spanGaps: true, tension: 0.25,
    }));
    if (w.threshold) {
      datasets.push({
        label: '門檻', data: allDates.map(() => w.threshold),
        borderColor: 'rgba(42,36,32,0.35)', borderWidth: 1.5, borderDash: [6, 5],
        pointRadius: 0, pointHoverRadius: 0,
      });
    }
    new Chart(card.querySelector('canvas'), {
      type: 'line',
      data: { labels: allDates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: datasets.length > 2, labels: { usePointStyle: true, boxWidth: 8, font: { size: 12 } } },
          tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + (c.parsed.y === null ? '—' : fmt(c.parsed.y) + ' ' + cur) } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 8, font: { size: 11 } } },
          y: { grid: { color: 'rgba(42,36,32,0.06)' }, ticks: { callback: (v) => fmt(v), font: { size: 11 } } },
        },
      },
    });
  });
}
main();
</script>
</body>
</html>
